name: Claude Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open PR number to review again
        type: number
        required: true

permissions: {}

jobs:
  review:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/claude-review') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      issues: read
      checks: write
      actions: read
      statuses: read
    env:
      CLAUDE_REVIEW_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL }}
    steps:
      # Only trusted workflow code executes. PR source is materialized as data.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare revision and pending check
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/review/review.mjs prepare
      - name: Validate account configuration
        if: steps.prepare.outputs.ready == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node .github/review/review.mjs configuration
      - name: Install pinned Claude Code
        if: steps.prepare.outputs.ready == 'true'
        run: npm install --global @anthropic-ai/claude-code@2.1.267
      - name: Independent read-only review
        id: claude
        if: steps.prepare.outputs.ready == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node .github/review/review.mjs review
      - name: Publish review and complete check
        if: always() && steps.prepare.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_OUTCOME: ${{ steps.claude.outcome }}
        run: node .github/review/review.mjs publish
